# Copy this file to src/main/resources/application.properties for local setup.
# Keep application.properties out of Git; set the matching environment variables in deployment.
spring.application.name=StudyCompanion-Backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/study_companion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.port=${PORT:8080}
